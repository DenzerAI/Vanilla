name: Source privacy
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source-privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/security-scan.py --revision HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 -m pip install pytest
      - run: python3 -m pytest core/tests/test_source_privacy.py -q
