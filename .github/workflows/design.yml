name: Design gate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wrapper/package-lock.json
      - run: npm ci --prefix wrapper
      - run: npm --prefix wrapper run design:verify
      - run: npm --prefix wrapper run build
