[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-core"
version = "0.3.0"
description = "Local agent workspace: FastAPI, SQLite, linked Markdown and optional workers"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "rapidfuzz>=3.12,<4",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
embeddings = ["sentence-transformers>=3,<6"]

[project.scripts]
agent-core = "core.__main__:main"

[tool.setuptools.packages.find]
include = ["core*"]

[tool.pytest.ini_options]
testpaths = ["core/tests"]
